apiVersion: v1
kind: Pod
metadata:
  name: writable-rootfs-example
spec:
  hostNetwork: false
  containers:
    - name: app
      image: nginx:1.27
      securityContext:
        privileged: false
        runAsUser: 10001
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop:
            - ALL

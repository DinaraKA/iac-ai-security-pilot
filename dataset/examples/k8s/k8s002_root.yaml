apiVersion: v1
kind: Pod
metadata:
  name: synthetic-root-test
spec:
  hostNetwork: false
  containers:
    - name: app
      image: nginx:1.27
      securityContext:
        privileged: false
        runAsUser: 0
        runAsNonRoot: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
